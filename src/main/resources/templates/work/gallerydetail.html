<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Detail | BIDEO</title>
    <th:block th:replace="~{layout/layout :: ytShellHead('Gallery Detail - Bideo')}"></th:block>
    <!-- 새로 만든 CSS 파일 연결 (상대 경로) -->
    <link rel="stylesheet" href="/css/work/gallery-detail.css" th:href="@{/css/work/gallery-detail.css}">
</head>
<body class="gallery-detail-body" id="section">
    <div th:replace="~{layout/layout :: ytShellChrome('gallery')}"></div>

    <main class="bd-shell__page-content gallery-page" aria-label="예술관 상세">
        <div id="page-manager" class="gallery-page-manager">
            <div class="gallery-browse" data-rounded-container page-subtype="home">
                
                <div id="header" class="gallery-header">
                    <div class="gallery-top-actions" aria-label="상단 액션">
                        <button class="gallery-top-action-button"
                                type="button"
                                aria-label="추가 작업"
                                aria-expanded="false"
                                data-role="gallery-top-menu-button"
                                th:if="${gallery != null and gallery.isOwner}">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 4a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Z"></path>
                            </svg>
                        </button>
                        <button class="gallery-top-action-button" type="button" aria-label="닫기" data-role="gallery-close-button">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17.293 5.293 12 10.586 6.707 5.293a1 1 0 10-1.414 1.414L10.586 12l-5.293 5.293a1 1 0 001.414 1.414L12 13.414l5.293 5.293a1 1 0 001.414-1.414L13.414 12l5.293-5.293a1 1 0 10-1.414-1.414Z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="gallery-carousel-header">
                        <div id="contents" class="gallery-carousel-contents">
                            <div class="gallery-carousel-item grid grid-disabled">
                                <div id="carousel-item" class="gallery-carousel-card">
                                    <div class="gallery-promo-panel" data-panel-layout="DEFAULT_PROMO_PANEL_RENDERER_LAYOUT_B">
                                        
                                        <div id="hero"
                                             class="gallery-hero"
                                             th:if="${gallery != null and gallery.coverImage != null and !#strings.isEmpty(gallery.coverImage)}"
                                             th:style="|background-image: url('${gallery.coverImage}');|"></div>
                                        <div id="hero"
                                             class="gallery-hero"
                                             th:unless="${gallery != null and gallery.coverImage != null and !#strings.isEmpty(gallery.coverImage)}"
                                             style="background-image: url('https://i.ytimg.com/vi/JUSvuYc02WA/maxresdefault.jpg');"></div>
                                        <div id="scrim" class="gallery-scrim"></div>
                                       
                                        <!-- 예술관 내용 -->

                                        <div id="content" class="gallery-promo-content grid grid-disabled">
                                            <div class="promo-text-wrapper">
                                                
                                                <h1 id="hero-title" class="gallery-hero-title" th:text="${gallery != null ? gallery.title : '예술관 제목'}">예술관 제목</h1>
                                                
                                                <div id="description" class="gallery-description">
                                                    <span th:text="${gallery != null ? gallery.description : '예술관 설명'}">예술관 설명</span>
                                                </div>

                                                <a class="hero-meta"
                                                   th:if="${gallery != null and gallery.memberNickname != null and !#strings.isEmpty(gallery.memberNickname)}"
                                                   th:href="@{/profile/{nickname}(nickname=${gallery.memberNickname})}"
                                                   th:text="|@${gallery.memberNickname}|">@artist</a>


                                                 <p class="hero-meta"
                                                    th:text="|작품 ${gallery != null and gallery.workCount != null ? gallery.workCount : 0}개 · 조회수 ${gallery != null and gallery.viewCount != null ? gallery.viewCount : 0}회|">작품 0개 · 조회수 0회</p>

                                                <div class="gallery-hero-tags"
                                                     th:if="${gallery != null and gallery.tags != null and !#lists.isEmpty(gallery.tags)}">
                                                    <a class="gallery-hero-tag"
                                                       th:each="tag : ${gallery.tags}"
                                                       th:href="@{/main(tag=${tag.tagName})}"
                                                       th:text="'#' + ${tag.tagName}">#태그</a>
                                                </div>

                                                 <!-- [추가] 시청하기 아래 썸네일 내비게이션 영역 -->
                                                <!-- <div id="pagination-thumbnails" class="style-scope ytd-carousel-item-renderer">
                                                    <button class="selected style-scope ytd-carousel-item-renderer">
                                                        <div class="thumb-img-wrapper">
                                                            <img src="https://i.ytimg.com/vi/JUSvuYc02WA/hqdefault.jpg" alt="Thumb 1">
                                                        </div>
                                                        <div class="progress-bar style-scope ytd-carousel-item-renderer"></div>
                                                    </button>
                                                    <button class="style-scope ytd-carousel-item-renderer">
                                                        <div class="thumb-img-wrapper">
                                                            <img src="https://i.ytimg.com/vi/t8ENzGqyiMI/hqdefault.jpg" alt="Thumb 2">
                                                        </div>
                                                        <div class="progress-bar style-scope ytd-carousel-item-renderer"></div>
                                                    </button>
                                                    <button class="style-scope ytd-carousel-item-renderer">
                                                        <div class="thumb-img-wrapper">
                                                            <img src="https://i.ytimg.com/vi/nMQpvfvQwvQ/hqdefault.jpg" alt="Thumb 3">
                                                        </div>
                                                        <div class="progress-bar style-scope ytd-carousel-item-renderer"></div>
                                                    </button>
                                                    
                                                </div> -->
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI 추천 작품 섹션 -->
                <div class="ai-rec-section" id="aiRecSection"
                     th:if="${gallery != null and (gallery.showSimilar == null or gallery.showSimilar)}">
                    <div class="ai-rec-header">
                        <span class="ai-rec-badge">AI가 픽업한 회원님을 위한 초정밀 큐레이션</span>
                        <div class="ai-rec-header-text">
                        </div>
                    </div>
                    <div class="ai-rec-scroll-wrap">
                        <div class="ai-rec-list" id="aiRecList">
                            <div class="ai-rec-loading">
                                <span class="ai-rec-spinner"></span>
                                추천 작품을 분석 중입니다.
                            </div>
                        </div>
                    </div>
                </div>

                <div class="gallery-results grid grid-disabled">
                    <div id="primary" class="gallery-results-primary">
                        <div class="gallery-rich-grid">
                            <div id="contents" class="gallery-rich-grid-contents">
                                <!-- Shorts 섹션 -->

                                <!-- 동영상 그리드 -->
                                <div class="content-row-section">
                                    <h2>인기 작품</h2>
                                    <div class="video-grid">
                                        <a class="video-item"
                                           th:if="${gallery != null and !#lists.isEmpty(gallery.works)}"
                                           th:each="work : ${gallery.works}"
                                           th:attr="data-work-id=${work.id}"
                                           th:href="@{/work/detail/{id}(id=${work.id})}">
                                            <div class="thumb">
                                                <img th:if="${work.thumbnailUrl != null and !#strings.isEmpty(work.thumbnailUrl)}"
                                                     th:unless="${work.thumbnailFileType != null and #strings.startsWith(work.thumbnailFileType, 'video/')}"
                                                     th:src="${work.thumbnailUrl}"
                                                     th:alt="${work.title}">
                                                <video th:if="${work.thumbnailUrl != null and !#strings.isEmpty(work.thumbnailUrl) and work.thumbnailFileType != null and #strings.startsWith(work.thumbnailFileType, 'video/')}"
                                                       th:src="${work.thumbnailUrl}"
                                                       muted
                                                       loop
                                                       playsinline
                                                       preload="metadata"></video>
                                            </div>
                                            <div class="item-meta">
                                                <div class="item-avatar">
                                                    <span th:if="${work.memberNickname != null and !#strings.isEmpty(work.memberNickname)}"
                                                          class="item-profile-link"
                                                          th:attr="data-profile-url=@{/profile/{nickname}(nickname=${work.memberNickname})}">
                                                        <img th:if="${work.memberProfileImage != null and !#strings.isEmpty(work.memberProfileImage)}"
                                                             th:src="${work.memberProfileImage}"
                                                             th:alt="${work.memberNickname != null ? work.memberNickname : '작가'}">
                                                    </span>
                                                </div>
                                                <div class="item-copy">
                                                    <h3 th:text="${work.title}">작품 제목</h3>
                                                    <span class="item-channel item-profile-link"
                                                          th:if="${work.memberNickname != null and !#strings.isEmpty(work.memberNickname)}"
                                                          th:attr="data-profile-url=@{/profile/{nickname}(nickname=${work.memberNickname})}"
                                                          th:text="|@${work.memberNickname}|">@작가명</span>
                                                    <p class="item-channel"
                                                       th:unless="${work.memberNickname != null and !#strings.isEmpty(work.memberNickname)}">작가명</p>
                                                    <p class="item-stats"
                                                       th:text="|조회수 ${work.viewCount == null ? 0 : work.viewCount}회 · 좋아요 ${work.likeCount == null ? 0 : work.likeCount}개|">조회수 0회 · 좋아요 0개</p>
                                                </div>
                                            </div>
                                        </a>
                                        <div th:if="${gallery == null or #lists.isEmpty(gallery.works)}">
                                            등록된 작품이 없습니다.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="work-action-sheet"
         hidden
         data-role="gallery-top-action-menu"
         aria-hidden="true"
         th:if="${gallery != null and gallery.isOwner}">
        <button class="danger" type="button" data-role="gallery-edit-button">수정하기</button>
        <button class="danger" type="button" data-role="gallery-delete-button">삭제하기</button>
        <button class="cancel" type="button">취소</button>
    </div>
    <th:block th:replace="~{layout/layout :: ytShellScripts()}"></th:block>
    <script th:inline="javascript">
        (() => {
            const galleryId = [[${gallery != null ? gallery.id : null}]];
            const menuButton = document.querySelector('[data-role="gallery-top-menu-button"]');
            const menu = document.querySelector('[data-role="gallery-top-action-menu"]');
            const closeButton = document.querySelector('[data-role="gallery-close-button"]');
            const editButton = document.querySelector('[data-role="gallery-edit-button"]');
            const deleteButton = document.querySelector('[data-role="gallery-delete-button"]');

            const closeMenu = () => {
                if (!menu || !menuButton) {
                    return;
                }
                menu.hidden = true;
                menu.setAttribute("aria-hidden", "true");
                menuButton.setAttribute("aria-expanded", "false");
            };

            const openMenu = () => {
                if (!menu || !menuButton) {
                    return;
                }
                menu.hidden = false;
                menu.setAttribute("aria-hidden", "false");
                menuButton.setAttribute("aria-expanded", "true");
            };

            if (menuButton && menu) {
                menuButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    if (menu.hidden) {
                        openMenu();
                        return;
                    }

                    closeMenu();
                });

                menu.addEventListener("click", (event) => {
                    const cancelButton = event.target.closest(".cancel");
                    event.stopPropagation();
                    if (cancelButton) {
                        closeMenu();
                    }
                });
            }

            editButton?.addEventListener("click", () => {
                closeMenu();
                if (galleryId) {
                    const editUrl = `/gallery/${galleryId}/edit`;
                    if (typeof window.openComposeModal === "function") {
                        window.openComposeModal(editUrl);
                        return;
                    }
                    window.location.href = editUrl;
                }
            });

            deleteButton?.addEventListener("click", async () => {
                closeMenu();
                if (!galleryId) {
                    return;
                }

                if (!window.confirm("예술관을 삭제하시겠습니까? 포함된 작품도 함께 삭제됩니다.")) {
                    return;
                }

                try {
                    const response = await fetch(`/api/galleries/${galleryId}`, {
                        method: "DELETE"
                    });

                    if (!response.ok) {
                        const message = await response.text();
                        throw new Error(message || "예술관 삭제에 실패했습니다.");
                    }

                    window.location.href = "/profile";
                } catch (error) {
                    window.alert(error.message || "예술관 삭제 중 오류가 발생했습니다.");
                }
            });

            document.addEventListener("click", closeMenu);

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeMenu();
                }
            });

            closeButton?.addEventListener("click", () => {
                closeMenu();
                window.location.href = "/profile";
            });

            document.querySelectorAll(".item-profile-link").forEach((node) => {
                node.addEventListener("click", (event) => {
                    const profileUrl = node.getAttribute("data-profile-url");
                    if (!profileUrl) {
                        return;
                    }

                    event.preventDefault();
                    event.stopPropagation();
                    window.location.href = profileUrl;
                });
            });

            document.querySelectorAll(".video-item").forEach((item) => {
                const workId = item.getAttribute("data-work-id");
                const video = item.querySelector("video");

                if (video) {
                    video.pause();
                    video.currentTime = 0;

                    item.addEventListener("mouseenter", () => {
                        video.play().catch(() => {});
                    });

                    item.addEventListener("mouseleave", () => {
                        video.pause();
                        video.currentTime = 0;
                    });
                }

                item.addEventListener("click", async (event) => {
                    const href = item.getAttribute("href");
                    if (!workId || !href || event.defaultPrevented) {
                        return;
                    }

                    event.preventDefault();
                    try {
                        await fetch(`/api/works/${workId}/views`, {
                            method: "POST",
                            keepalive: true
                        });
                    } catch (_) {
                        // 조회수 반영 실패가 상세 이동을 막으면 안 된다.
                    }
                    window.location.href = href;
                });
            });
        })();
    </script>

    <!-- AI 추천 작품 JS -->
    <script th:inline="javascript">
        (async function loadAiWorkRecommend() {
            const listEl  = document.getElementById('aiRecList');
            const section = document.getElementById('aiRecSection');
            if (!listEl || !section) return;

            const galleryId = /*[[${gallery != null ? gallery.id : null}]]*/ null;
            if (!galleryId) { section.remove(); return; }

            try {
                const res = await fetch(`/api/galleries/${galleryId}/similar-works?limit=8`, {
                    headers: { 'Accept': 'application/json' }
                });
                if (!res.ok) throw new Error('추천 API 오류: ' + res.status);
                const items = await res.json();

                if (!items || items.length === 0) {
                    listEl.innerHTML = '<p class="ai-rec-empty">유사한 작품이 없습니다.</p>';
                    return;
                }

                listEl.innerHTML = items.map(item => {
                    const thumbHtml = item.thumbnailUrl
                        ? `<img src="${item.thumbnailUrl}" alt="${item.title}" class="ai-work-thumb-img">`
                        : `<div class="ai-work-thumb-placeholder">${item.title ? item.title[0].toUpperCase() : '?'}</div>`;
                    return `
                        <a class="ai-work-card" href="/work/detail/${item.id}">
                            <div class="ai-work-thumb">${thumbHtml}</div>
                            <div class="ai-work-info">
                                <p class="ai-work-title">${item.title}</p>
                                <p class="ai-work-meta">@${item.memberNickname ?? ''}</p>
                                <p class="ai-work-stats">조회수 ${(item.viewCount ?? 0).toLocaleString()}</p>
                            </div>
                        </a>`;
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<p class="ai-rec-empty">AI 추천 서버에 연결할 수 없습니다.</p>';
                console.error('[AI 추천]', e);
            }
        })();
    </script>
</body>
</html>
