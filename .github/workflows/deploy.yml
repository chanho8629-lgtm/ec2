name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    if: github.repository == 'bideo-ec2/ec2'
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - name: EC2_HOST1
          - name: EC2_HOST2

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set HOST env var from secrets
        run: |
          echo "HOST=${{ secrets[matrix.name] }}" >> $GITHUB_ENV
          echo "FASTAPI_BASE_URL=http://127.0.0.1:8000" >> $GITHUB_ENV
          echo "BOOTPAY_JS_APPLICATION_ID=${{ secrets.BOOTPAY_JS_APPLICATION_ID || secrets.BOOTPAY_JS_API_KEY }}" >> $GITHUB_ENV

      - name: Normalize FastAPI base URL
        run: |
          RAW_FASTAPI_BASE_URL="${FASTAPI_BASE_URL}"
          if [ -z "$RAW_FASTAPI_BASE_URL" ]; then
            echo "FASTAPI_BASE_URL or ML_API_BASE_URL secret is required" >&2
            exit 1
          fi
          case "$RAW_FASTAPI_BASE_URL" in
            http://*|https://*)
              NORMALIZED_FASTAPI_BASE_URL="$RAW_FASTAPI_BASE_URL"
              ;;
            host.docker.internal:*|localhost:*|127.*|10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.20.*|172.21.*|172.22.*|172.23.*|172.24.*|172.25.*|172.26.*|172.27.*|172.28.*|172.29.*|172.30.*|172.31.*|192.168.*)
              NORMALIZED_FASTAPI_BASE_URL="http://$RAW_FASTAPI_BASE_URL"
              ;;
            *)
              NORMALIZED_FASTAPI_BASE_URL="https://$RAW_FASTAPI_BASE_URL"
              ;;
          esac
          NORMALIZED_FASTAPI_BASE_URL="${NORMALIZED_FASTAPI_BASE_URL%/}"
          echo "FASTAPI_BASE_URL=$NORMALIZED_FASTAPI_BASE_URL" >> $GITHUB_ENV
          echo "FASTAPI_HOST=$(printf '%s' "$NORMALIZED_FASTAPI_BASE_URL" | sed -E 's#^https?://([^/]+).*#\1#')" >> $GITHUB_ENV

      - name: Validate Bootpay JS key
        run: |
          if [ -z "$BOOTPAY_JS_APPLICATION_ID" ]; then
            echo "BOOTPAY_JS_APPLICATION_ID or BOOTPAY_JS_API_KEY secret is required" >&2
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: Copy project to EC2
        run: |
          rsync -avz --delete --delete-excluded \
            --exclude='.git' \
            --exclude='.idea' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='out' \
            --exclude='.vscode' \
            --exclude='.claude' \
            -e "ssh -i ~/.ssh/id_rsa" . ${{ secrets.EC2_USER }}@$HOST:/home/ubuntu/bideo

      - name: Debug secret presence
        run: |
          echo "PSQL_PORT length: ${#X1}"
          echo "PSQL_DATABASE length: ${#X2}"
          echo "PSQL_USERNAME length: ${#X3}"
          echo "PSQL_PASSWORD length: ${#X4}"
          echo "REDIS_PORT length: ${#X5}"
          echo "EC2_HOST length: ${#X6}"
          echo "JWT_SECRET length: ${#X7}"
          echo "AWS_BUCKET_NAME length: ${#A1}"  
          echo "ML_API_BASE_URL length: ${#A2}"
          echo "FASTAPI_BASE_URL length: ${#FASTAPI_BASE_URL}"
          echo "BOOTPAY_JS_APPLICATION_ID length: ${#BOOTPAY_JS_APPLICATION_ID}"
          echo "BOOTPAY_PRIVATE_KEY length: ${#A3}"
          echo "BOOTPAY_REST_API_KEY length: ${#A4}"
          echo "SOLAPI_API_SECRET length: ${#A5}"
          echo "SPRING_MAIL_PASSWORD length: ${#A6}"
          echo "EC2_USER length: ${#A7}"
          echo "EC2_KEY length: ${#A8}"
        
        env:
          X1: ${{ secrets.PSQL_PORT }}
          X2: ${{ secrets.PSQL_DATABASE }}
          X3: ${{ secrets.PSQL_USERNAME }}
          X4: ${{ secrets.PSQL_PASSWORD }}
          X5: ${{ secrets.REDIS_PORT }}
          X6: ${{ secrets.EC2_HOST }}
          X7: ${{ secrets.JWT_SECRET }}
          A1: ${{ secrets.AWS_BUCKET_NAME }}
          A2: ${{ secrets.ML_API_BASE_URL }}
          A3: ${{ secrets.BOOTPAY_PRIVATE_KEY }}
          A4: ${{ secrets.BOOTPAY_REST_API_KEY }}
          A5: ${{ secrets.SOLAPI_API_SECRET }}
          A6: ${{ secrets.SPRING_MAIL_PASSWORD }}
          A7: ${{ secrets.EC2_USER }}
          A8: ${{ secrets.EC2_KEY }}

      - name: Ensure DB schema and seed data
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@$HOST << EOF
            cd /home/ubuntu/bideo
            PSQL_PORT=${{ secrets.PSQL_PORT }} \
            PSQL_DATABASE=${{ secrets.PSQL_DATABASE }} \
            PSQL_USERNAME=${{ secrets.PSQL_USERNAME }} \
            PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }} \
            SQL_DIR=/home/ubuntu/bideo/src/main/resources/sql \
            bash scripts/deploy/ensure-db-schema.sh
          EOF

      - name: Build & Run Docker on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@$HOST << EOF
            set -e
            cd /home/ubuntu/bideo
            docker build \
              --build-arg EC2_HOST=${{ secrets.EC2_HOST }} \
              --build-arg PSQL_PORT=${{ secrets.PSQL_PORT }} \
              --build-arg PSQL_DATABASE=${{ secrets.PSQL_DATABASE }} \
              --build-arg PSQL_USERNAME=${{ secrets.PSQL_USERNAME }} \
              --build-arg PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }} \
              --build-arg REDIS_PORT=${{ secrets.REDIS_PORT }} \
              --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} \
              --build-arg AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
              --build-arg AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
              --build-arg AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }} \
              --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
              --build-arg KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }} \
              --build-arg KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }} \
              --build-arg NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }} \
              --build-arg NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }} \
              --build-arg GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              --build-arg GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              --build-arg BOOTPAY_JS_API_KEY=${{ secrets.BOOTPAY_JS_API_KEY }} \
              --build-arg BOOTPAY_JS_APPLICATION_ID="$BOOTPAY_JS_APPLICATION_ID" \
              --build-arg BOOTPAY_REST_API_KEY=${{ secrets.BOOTPAY_REST_API_KEY }} \
              --build-arg BOOTPAY_PRIVATE_KEY=${{ secrets.BOOTPAY_PRIVATE_KEY }} \
              --build-arg SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }} \
              --build-arg SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }} \
              --build-arg APP_MAIL_FROM_ADDRESS=${{ secrets.APP_MAIL_FROM_ADDRESS }} \
              --build-arg SOLAPI_API_KEY=${{ secrets.SOLAPI_API_KEY }} \
              --build-arg SOLAPI_API_SECRET=${{ secrets.SOLAPI_API_SECRET }} \
              --build-arg SOLAPI_FROM_NUMBER=${{ secrets.SOLAPI_FROM_NUMBER }} \
              --build-arg ML_API_BASE_URL=${{ secrets.ML_API_BASE_URL }} \
              --build-arg FASTAPI_BASE_URL="$FASTAPI_BASE_URL" \
              -t bideo:next .
            if docker ps --format '{{.Names}}' | grep -qx bideo; then
              docker stop bideo
            fi
            if docker ps -a --format '{{.Names}}' | grep -qx bideo; then
              docker rm bideo
            fi
            docker tag bideo:next bideo:latest
            cat > /tmp/bideo.env << 'ENVVARS'
            EC2_HOST=${{ secrets.EC2_HOST }}
            PSQL_PORT=${{ secrets.PSQL_PORT }}
            PSQL_DATABASE=${{ secrets.PSQL_DATABASE }}
            PSQL_USERNAME=${{ secrets.PSQL_USERNAME }}
            PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            BOOTPAY_JS_API_KEY=${{ secrets.BOOTPAY_JS_API_KEY }}
            BOOTPAY_JS_APPLICATION_ID=$BOOTPAY_JS_APPLICATION_ID
            BOOTPAY_REST_API_KEY=${{ secrets.BOOTPAY_REST_API_KEY }}
            BOOTPAY_PRIVATE_KEY=${{ secrets.BOOTPAY_PRIVATE_KEY }}
            SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
            APP_MAIL_FROM_ADDRESS=${{ secrets.APP_MAIL_FROM_ADDRESS }}
            SOLAPI_API_KEY=${{ secrets.SOLAPI_API_KEY }}
            SOLAPI_API_SECRET=${{ secrets.SOLAPI_API_SECRET }}
            SOLAPI_FROM_NUMBER=${{ secrets.SOLAPI_FROM_NUMBER }}
            ML_API_BASE_URL=${{ secrets.ML_API_BASE_URL }}
            FASTAPI_BASE_URL=$FASTAPI_BASE_URL
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_TEXT_MODEL=${{ secrets.OPENAI_TEXT_MODEL || 'gpt-4o-mini' }}
            OPENAI_IMAGE_MODEL=${{ secrets.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
            RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
            RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
            RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
            RABBITMQ_PASS=${{ secrets.RABBITMQ_PASS }}
            ENVVARS
            sed -i 's/^[[:space:]]*//' /tmp/bideo.env
            chmod 600 /tmp/bideo.env
            docker run -d -p 80:10000 --name bideo --add-host=host.docker.internal:host-gateway --env-file /tmp/bideo.env bideo:latest
            docker exec bideo sh -c 'echo "FASTAPI_BASE_URL=$FASTAPI_BASE_URL"'
            docker exec bideo sh -c 'echo "BOOTPAY_JS_APPLICATION_ID length=${#BOOTPAY_JS_APPLICATION_ID}"'
            for i in \$(seq 1 30); do
              if docker exec bideo sh -c 'curl -fsS "$FASTAPI_BASE_URL/api/health" >/dev/null'; then
                echo "FastAPI health OK"
                break
              fi
              if [ "\$i" = "30" ]; then
                docker logs bideo --tail 250
                exit 1
              fi
              sleep 2
            done
            docker exec bideo sh -c 'curl -fsS "$FASTAPI_BASE_URL/docs" >/dev/null && echo "FastAPI docs OK"'
            if command -v nginx >/dev/null 2>&1; then
              sudo mkdir -p /etc/nginx/conf.d
              printf 'client_max_body_size 100m;\n' | sudo tee /etc/nginx/conf.d/bideo-upload.conf >/dev/null
              sudo nginx -t
              if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files nginx.service >/dev/null 2>&1; then
                sudo systemctl reload nginx
              else
                sudo nginx -s reload
              fi
            else
              echo "nginx not installed on this host; skipped nginx upload limit configuration"
            fi
          EOF

      - name: Clean up dangling images
        if: success()
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@$HOST << 'EOF'
            docker image prune -f
            docker container prune -f
          EOF
